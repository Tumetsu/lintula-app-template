name: Template CI

# Renders the template for every answer combination and runs the generated
# project's full check suite on each, plus an update from the last release.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  render-and-check:
    name: Render (${{ matrix.ui }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ui: [mui, shadcn]

    # For the initial-migration check: a generated project ships no migrations.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout template
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Configure git
        run: |
          git config --global user.name "template-ci"
          git config --global user.email "template-ci@example.com"
          git config --global init.defaultBranch main

      - name: Render project
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name="Template Check" --data ui=${{ matrix.ui }} \
            . "$RUNNER_TEMP/project"

      - name: Install Chromium for browser-mode tests
        working-directory: ${{ runner.temp }}/project/frontend
        run: npx playwright install --with-deps chromium

      - name: Run the generated project's checks
        env:
          CHECK_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: scripts/check-generated.sh "$RUNNER_TEMP/project" --docker

      - name: Update from the last release
        run: scripts/test-update.sh ${{ matrix.ui }} "$RUNNER_TEMP/update"
